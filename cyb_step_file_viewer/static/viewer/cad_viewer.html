<html style="height: 100%; width: 100%;">

<head>
    <title>3D Preview -
        <t t-esc="file_name" />
    </title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Font Awesome (Odoo standard) -->
    <link rel="stylesheet" href="/web/static/src/libs/fontawesome/css/font-awesome.css" />

    <link rel="stylesheet" href="/cyb_step_file_viewer/static/viewer/popovers.css" />
    <link rel="stylesheet" href="/cyb_step_file_viewer/static/viewer/cad_viewer.css" />

    <!-- Three.js from Local Libs (ESM) -->
    <script type="importmap">
    {
        "imports": {
            "three_core": "/cyb_step_file_viewer/static/viewer/libs/three_core.js",
            "three_modules": "/cyb_step_file_viewer/static/viewer/libs/three_modules.js",
            "OrbitControls": "/cyb_step_file_viewer/static/viewer/libs/orbit_controls.js",
            "GLTFLoader": "/cyb_step_file_viewer/static/viewer/libs/gltf_loader.js",
            "BufferGeometryUtils": "/cyb_step_file_viewer/static/viewer/libs/buffer_geometry.js",
            "GLTFExporter": "/cyb_step_file_viewer/static/viewer/libs/gltf_exporter.js"
        }
    }
</script>
</head>

<body style="margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background: #000;">
    <input type="hidden" id="step_viewer_file_url" t-att-value="file_url" />
    <div id="cad-viewer-root" style="height: 100%; width: 100%;"></div>

    <script type="module" src="/cyb_step_file_viewer/static/viewer/cad_viewer.js"></script>
</body>

</html>
